name: tidy
on:
  push:
    branches: [check/tidy]
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          export GOFLAGS=-mod=mod
          go build ./cmd/... ./lepton/... ./types/... 2>&1 | grep -v downloading | tail -5 || true
          echo '=====DIFF'
          git diff go.mod
          echo '=====SUMSTAT'
          git diff --stat go.sum
          echo '=====END'
