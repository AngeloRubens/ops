name: tidy
on:
  push:
    branches: [check/tidy]
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go mod tidy || true
          git diff go.mod
          git diff --stat go.sum
          echo '=====GOMOD'
          cat go.mod
