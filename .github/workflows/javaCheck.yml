name: from-docker --trace, java and friends
on:
  push:
    branches: [check/split-3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o ops -v
      - uses: actions/upload-artifact@v4
        with:
          name: ops-java
          path: ops
      # dir: scenario directory under test/dockerfile; df: the Dockerfile in it (its directory is the
      # build context); exe: the program the container ends up running; settle: seconds the image
      # runs with its own command before that program is looked for; trace: --observe-timeout;
      # port/path/match: what the booted package has to answer (on the console when port is empty);
      # wait: turns of 2 s for the boot
      - id: matrix
        run: |
          cat > m.json <<'EOF'
          [
           {"name":"temurin","diag":true,"dir":"temurin-jre-resolved","df":"Dockerfile","bargs":"","exe":"java","settle":15,"trace":60,"port":"8080","path":"/","match":"hello from java","wait":240},
           {"name":"semeru","diag":true,"dir":"semeru","df":"Dockerfile","bargs":"","exe":"java","settle":15,"trace":60,"port":"8080","path":"/","match":"hello from java","wait":240},
           {"name":"glassfish","dir":"glassfish","df":"Dockerfile","bargs":"","exe":"java","settle":90,"trace":300,"port":"8080","path":"/","match":"GlassFish","wait":700},
           {"name":"wildfly","dir":"wildfly","df":"Dockerfile","bargs":"","exe":"java","settle":45,"trace":180,"port":"8080","path":"/","match":"WildFly","wait":600},
           {"name":"tomcat","dir":"tomcat","df":"Dockerfile","bargs":"","exe":"java","settle":30,"trace":120,"port":"8080","path":"/","match":"Apache Tomcat","wait":400},
           {"name":"springboot","dir":"springboot","df":"Dockerfile","bargs":"","exe":"java","settle":30,"trace":180,"port":"8080","path":"/","match":"hello from spring boot","wait":600},
           {"name":"quarkus","dir":"quarkus","df":"Dockerfile.jvm","bargs":"","exe":"java","settle":30,"trace":180,"port":"8080","path":"/hello","match":"Hello","wait":600},
           {"name":"helidon","dir":"helidon","df":"app/Dockerfile","bargs":"","exe":"java","settle":30,"trace":120,"port":"8080","path":"/greet","match":"Hello World","wait":400},
           {"name":"openliberty","dir":"openliberty","df":"upstream/releases/latest/kernel-slim/Dockerfile.ubi10-minimal.openjdk21","bargs":"","exe":"java","settle":90,"trace":300,"port":"","path":"","match":"CWWKF0011I","wait":600},
           {"name":"mysql","dir":"mysql-resolved","df":"Dockerfile","bargs":"","exe":"mysqld","settle":90,"trace":240,"port":"","path":"","match":"ready for connections","wait":600},
           {"name":"rocketmq","dir":"rocketmq-resolved","df":"Dockerfile","bargs":"","exe":"java","settle":45,"trace":240,"port":"","path":"","match":"The Name Server boot success","wait":600},
           {"name":"activemq","dir":"activemq","df":"Dockerfile","bargs":"--build-arg java_version=21 --build-arg activemq_dist=apache-activemq-6.1.4-bin.tar.gz","exe":"java","settle":45,"trace":240,"port":"","path":"","match":"ActiveMQ.*started","wait":600},
           {"name":"tomee","dir":"tomee","df":"Dockerfile","bargs":"","exe":"java","settle":60,"trace":240,"port":"8080","path":"/","match":"TomEE","wait":600},
           {"name":"vertx","dir":"vertx","df":"docker-maven/Dockerfile","ctx":".","bargs":"","exe":"java","settle":30,"trace":180,"port":"8888","path":"/","match":"Hello from Vert.x","wait":600},
           {"name":"hazelcast","dir":"hazelcast","df":"Dockerfile","bargs":"","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"is STARTED","wait":600},
           {"name":"cassandra","dir":"cassandra","df":"5.0/Dockerfile","ctx":"5.0","bargs":"","exe":"java","settle":90,"trace":300,"port":"","path":"","match":"Startup complete","wait":700},
           {"name":"aeron","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronarm","runner":"ubuntu-24.04-arm","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":1500},
           {"name":"aeronclient","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","udp":"9002","bootenv":"CLUSTER_ADDRESSES=10.0.2.15","client":"1","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronbridge3","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","nodes":"3","client":"1","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronbridge3dns","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","nodes":"3","dns":"1","client":"1","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronbridge1","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","nodes":"1","client":"1","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronadmin","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","udp":"9002","bootenv":"CLUSTER_ADDRESSES=10.0.2.15","client":"admin","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"aeronwild","dir":"aeron","df":"docker/Dockerfile","ctx":"docker","bargs":"--build-context gradle=@DIR@/cluster","env":"CLUSTER_NODE=0 CLUSTER_ADDRESSES=127.0.0.1 CLUSTER_PORT_BASE=9000 BASE_DIR=/home/aeron/jar/aeron-cluster","cmd":"[\"-Daeron.dir=/tmp/aeron\"]","udp":"9002","bootenv":"CLUSTER_ADDRESSES=0.0.0.0","client":"1","klibs":"tmpfs shmem","exe":"java","settle":60,"trace":240,"port":"","path":"","match":"LEADER","wait":600},
           {"name":"sockopt","dir":"sockopt","df":"Dockerfile","bargs":"","exe":"java","settle":15,"trace":60,"port":"","path":"","match":"SOCKOPT OK","wait":240},
           {"name":"clock","dir":"clock","df":"Dockerfile","bargs":"","exe":"java","settle":15,"trace":60,"port":"","path":"","match":"CLOCK DONE","wait":300}
          ]
          EOF
          # .github/javaCheck.only, when present, names the scenarios to run, one per line
          only="$(cat .github/javaCheck.only 2>/dev/null | xargs)"
          echo "matrix=$(jq -c --arg only "$only" '{include: [.[] | select($only == "" or (.name as $n | $only | split(" ") | index($n)))]}' m.json)" >> "$GITHUB_OUTPUT"
  scenario:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      NAME: ${{ matrix.name }}
      DIR: ${{ matrix.dir }}
      DF: ${{ matrix.df }}
      CTX: ${{ matrix.ctx }}
      IMGENV: ${{ matrix.env }}
      IMGCMD: ${{ matrix.cmd }}
      KLIBS: ${{ matrix.klibs }}
      BARGS: ${{ matrix.bargs }}
      EXE: ${{ matrix.exe }}
      SETTLE: ${{ matrix.settle }}
      TRACE: ${{ matrix.trace }}
      PORT: ${{ matrix.port }}
      URL_PATH: ${{ matrix.path }}
      MATCH: ${{ matrix.match }}
      WAIT: ${{ matrix.wait }}
      DIAG: ${{ matrix.diag }}
      UDP: ${{ matrix.udp }}
      CLIENT: ${{ matrix.client }}
      BOOTENV: ${{ matrix.bootenv }}
      # run of AngeloRubens/nanos whose artifact "kernel" is booted in place of the released one
      KERNEL_RUN: '41631996471'
      KERNEL_RUN_ARM: '41610947395'
    steps:
      - uses: actions/download-artifact@v4
        if: matrix.runner == ''
        with:
          name: ops-java
      - uses: actions/checkout@v4
        if: matrix.runner != ''
        with:
          path: opssrc
      - uses: actions/setup-go@v5
        if: matrix.runner != ''
        with:
          go-version-file: opssrc/go.mod
      - name: Build ops on this machine
        if: matrix.runner != ''
        run: cd opssrc && go build -o ../ops -v
      - name: Install qemu
        run: |
          chmod +x ops
          sudo apt-get update -qq
          if [ "$(uname -m)" = aarch64 ]; then sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 > /dev/null; else sudo apt-get install -y -qq qemu-system-x86 > /dev/null; fi
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      - name: Seed the ops home with the arm kernel under test
        if: matrix.runner != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(curl -fsSL https://storage.googleapis.com/nanos/release/latest.txt | tr -d '\n')
          echo "release $v"
          mkdir -p "$HOME/.ops/$v-arm"
          echo -n "$v" > "$HOME/.ops/latest.txt"
          gh run download "$KERNEL_RUN_ARM" -R AngeloRubens/nanos -n kernel-arm -D "$HOME/.ops/$v-arm"
          ls -la "$HOME/.ops" "$HOME/.ops/$v-arm"
      - name: Fetch the scenarios
        run: |
          git init -q sc && cd sc
          git fetch -q --depth=1 https://github.com/AngeloRubens/ops feat/from-dockerfile
          git checkout -q FETCH_HEAD -- test/dockerfile
          # the same hello server as temurin-jre-resolved, compiled for 21 and run on OpenJ9
          mkdir -p test/dockerfile/semeru
          cp test/dockerfile/temurin-jre-resolved/Main.java test/dockerfile/semeru/
          printf '%s\n' \
            'FROM eclipse-temurin:21-jdk AS build' \
            'WORKDIR /src' \
            'COPY Main.java .' \
            'RUN javac --release 21 Main.java && jar --create --file /app.jar --main-class Main Main.class' \
            'FROM ibm-semeru-runtimes:open-21-jre' \
            'COPY --from=build /app.jar /app.jar' \
            'CMD ["java", "-jar", "/app.jar"]' > test/dockerfile/semeru/Dockerfile
      - name: Fetch the TomEE Dockerfile
        run: |
          mkdir -p sc/test/dockerfile/tomee
          curl -fsSL -o sc/test/dockerfile/tomee/Dockerfile https://raw.githubusercontent.com/tomitribe/docker-tomee/master/TomEE-11.0/jre25/Temurin/ubuntu/plus/Dockerfile
      # What Aeron asks of a UDP socket and nothing else: the send and receive buffers read back after
      # being set. It stays alive so that it is the program left running when the trace ends.
      - name: Make the socket options program
        run: |
          d=sc/test/dockerfile/sockopt
          mkdir -p "$d"
          cat > "$d/Main.java" <<'EOF'
          import java.net.StandardSocketOptions;
          import java.nio.channels.DatagramChannel;
          public class Main {
            public static void main(String[] a) throws Exception {
              DatagramChannel c = DatagramChannel.open();
              int snd0 = c.getOption(StandardSocketOptions.SO_SNDBUF);
              int rcv0 = c.getOption(StandardSocketOptions.SO_RCVBUF);
              c.setOption(StandardSocketOptions.SO_SNDBUF, 131072);
              c.setOption(StandardSocketOptions.SO_RCVBUF, 131072);
              int snd = c.getOption(StandardSocketOptions.SO_SNDBUF);
              int rcv = c.getOption(StandardSocketOptions.SO_RCVBUF);
              System.out.println("SOCKOPT default SO_SNDBUF=" + snd0 + " SO_RCVBUF=" + rcv0);
              System.out.println("SOCKOPT after setting 131072 SO_SNDBUF=" + snd + " SO_RCVBUF=" + rcv);
              System.out.println(snd >= 1408 && rcv >= 1408 ? "SOCKOPT OK" : "SOCKOPT FAIL");
              Thread.sleep(600000);
            }
          }
          EOF
          printf '%s\n' \
            'FROM eclipse-temurin:21-jdk AS build' \
            'WORKDIR /src' \
            'COPY Main.java .' \
            'RUN javac --release 21 Main.java && jar --create --file /app.jar --main-class Main Main.class' \
            'FROM eclipse-temurin:21-jre' \
            'COPY --from=build /app.jar /app.jar' \
            'CMD ["java", "-jar", "/app.jar"]' > "$d/Dockerfile"
      # Sends the time of the machine to the host, once a second, to compare it with the host's own.
      - name: Make the clock program
        run: |
          d=sc/test/dockerfile/clock
          mkdir -p "$d"
          cat > "$d/Main.java" <<'EOF'
          import java.net.*;
          public class Main {
            public static void main(String[] a) throws Exception {
              DatagramSocket s = new DatagramSocket();
              InetAddress h = InetAddress.getByName("10.0.2.2");
              long m0 = System.nanoTime();
              for (int i = 0; i < 60; i++) {
                byte[] b = ("T " + System.currentTimeMillis() + " " + (System.nanoTime() - m0) / 1000000).getBytes();
                s.send(new DatagramPacket(b, b.length, h, 47000));
                Thread.sleep(1000);
              }
              System.out.println("CLOCK DONE");
              Thread.sleep(600000);
            }
          }
          EOF
          printf '%s\n' \
            'FROM eclipse-temurin:21-jdk AS build' \
            'WORKDIR /src' \
            'COPY Main.java .' \
            'RUN javac --release 21 Main.java && jar --create --file /app.jar --main-class Main Main.class' \
            'FROM eclipse-temurin:21-jre' \
            'COPY --from=build /app.jar /app.jar' \
            'CMD ["java", "-jar", "/app.jar"]' > "$d/Dockerfile"
      - name: Fetch the Vert.x project
        run: git clone -q --depth=1 https://github.com/vertx-howtos/executable-jar-docker-howto sc/test/dockerfile/vertx
      - name: Fetch the Hazelcast project
        run: |
          d=sc/test/dockerfile/hazelcast
          git clone -q --depth=1 https://github.com/hazelcast/hazelcast-docker hz-src
          mkdir -p "$d" && cp hz-src/hazelcast-oss/* "$d"/
          curl -fsSL -o "$d/hazelcast-distribution.zip" https://repo1.maven.org/maven2/com/hazelcast/hazelcast-distribution/5.7.0/hazelcast-distribution-5.7.0.zip
      - name: Fetch the Cassandra project
        run: git clone -q --depth=1 https://github.com/docker-library/cassandra sc/test/dockerfile/cassandra
      - uses: actions/setup-java@v4
        if: startsWith(matrix.name, 'aeron')
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch and build the Aeron project
        if: startsWith(matrix.name, 'aeron')
        run: |
          git clone -q --depth=1 https://github.com/AdaptiveConsulting/aeron-io-samples sc/test/dockerfile/aeron
          cd sc/test/dockerfile/aeron
          ./gradlew build -x test --no-daemon -q
          ls cluster/build/libs
      - name: Build the image
        run: |
          dir="$PWD/sc/test/dockerfile/$DIR"
          BARGS="${BARGS//@DIR@/$dir}"
          if [ -x "$dir/prepare.sh" ]; then "$dir/prepare.sh" "$dir" > prepare.log 2>&1 || { tail -80 prepare.log; exit 1; }; fi
          df="$dir/$DF"
          if [ -n "$CTX" ]; then ctx="$dir/$CTX"; else ctx="$(dirname "$df")"; fi
          # shellcheck disable=SC2086
          docker build -q $BARGS -t "jc-$NAME:latest" -f "$df" "$ctx" > build.log 2>&1 || { tail -40 build.log; exit 1; }
          if [ -n "$IMGENV" ]; then
            { echo "FROM jc-$NAME:latest"; for kv in $IMGENV; do echo "ENV $kv"; done; [ -n "$IMGCMD" ] && echo "CMD $IMGCMD"; } | docker build -q -t "jc-$NAME:latest" - > /dev/null
          fi
          docker image inspect "jc-$NAME:latest" --format 'image: {{.Size}} bytes, user {{.Config.User}}, workdir {{.Config.WorkingDir}}, entrypoint {{.Config.Entrypoint}} cmd {{.Config.Cmd}}'
      - name: Find the real command
        run: |
          docker run -d --name app "jc-$NAME:latest" > /dev/null
          sleep "$SETTLE"
          pids=$(docker top app -eo pid 2>/dev/null | tail -n +2 | sort -n || true)
          cands=()
          for p in $pids; do
            e=$(sudo readlink "/proc/$p/exe" 2>/dev/null) || continue
            [ "$(basename "$e")" = "$EXE" ] && cands+=("$p")
          done
          echo "processes named $EXE: ${cands[*]}"
          # the one that has no other of its kind below it: a launcher in java starts the server in java
          main=""
          for p in "${cands[@]}"; do
            leaf=1
            for q in "${cands[@]}"; do
              [ "$q" = "$p" ] && continue
              a=$q
              while [ "$a" -gt 1 ]; do
                a=$(sudo awk '{print $4}' "/proc/$a/stat" 2>/dev/null) || break
                [ "$a" = "$p" ] && { leaf=0; break; }
              done
            done
            [ $leaf = 1 ] && { main=$p; break; }
          done
          if [ -z "$main" ]; then
            echo "no $EXE process after $SETTLE s"; docker ps -a --filter name=app --format "{{.Status}}"; docker logs app 2>&1 | tail -60; exit 1
          fi
          mapfile -d '' argv < <(sudo cat "/proc/$main/cmdline")
          exe=$(sudo readlink "/proc/$main/exe")
          echo "main pid $main exe $exe cwd $(sudo readlink "/proc/$main/cwd") argc ${#argv[@]}"
          docker rm -f app > /dev/null
          file="${argv[0]}"
          case "$file" in */*) ;; *) file="$exe" ;; esac
          # the tool finds the program itself: the image is run the way it starts
          : > flags.bin
          printf '%s ' "${argv[@]}" | cut -c1-1500; echo
      - name: Build the package
        run: |
          mapfile -d '' flags < flags.bin
          rc=0
          ./ops pkg from-docker "jc-$NAME:latest" --observe --observe-timeout "$TRACE" --name "t-$NAME" --verbose "${flags[@]}" > pkg.log 2>&1 || rc=$?
          grep -E '^the program opened|is run by|did not open|opened nothing' pkg.log | head -20 || true
          echo "not carried: $(grep -c '^not carried' pkg.log)"; grep '^not carried' pkg.log | head -10 || true
          if [ $rc -ne 0 ]; then tail -30 pkg.log; exit 1; fi
          p="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME"
          echo "package: $(du -sh "$p/sysroot" | cut -f1), files: $(find "$p/sysroot" -type f | wc -l)"
          jq -c '{Program, Args: (.Args | tostring | .[0:600])}' "$p/package.manifest"
          echo "top of the sysroot:"; ls -la "$p/sysroot" | tail -n +4 | awk '{print "  " $1, $9, $10, $11}'
          home="$(dirname "$(dirname "$(jq -r .Program "$p/package.manifest")")")"
          echo "under $home/lib: $(ls "$p/sysroot$home/lib" 2>/dev/null | tr '\n' ' ' | cut -c1-600)"
      - name: Fetch the kernel under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$KERNEL_RUN"; art=kernel
          if [ "$(uname -m)" = aarch64 ]; then run="$KERNEL_RUN_ARM"; art=kernel-arm; fi
          echo "kernel run: $run $art"
          ls -la "$HOME/.ops" | head -20
          if [ -n "$run" ]; then gh run download "$run" -R AngeloRubens/nanos -n "$art" -D "$PWD/kdist"; find kdist | head -30
            if [ "$art" = kernel-arm ]; then
              for d in "$HOME"/.ops/0.*-arm; do
                [ -f "$d/kernel.img" ] || continue
                cp kdist/kernel.img kdist/bootaa64.efi "$d/"; rm -rf "$d/klibs"; cp -r kdist/klibs "$d/klibs"; echo "arm kernel under test installed in $d"; ls -la "$d"
              done
              rm -f "$HOME"/.ops/images/java*
              rm -rf kdist
            fi
            [ "$art" = kernel ] && for d in "$HOME"/.ops/0.*; do
              case "$d" in *-arm) continue;; esac
              [ -f "$d/kernel.img" ] || continue
              cp kdist/kernel.img kdist/boot.img "$d/"; rm -rf "$d/klibs"; cp -r kdist/klibs "$d/klibs"; echo "kernel under test installed in $d"; ls -la "$HOME"/.ops/images/ "$d"; rm -f "$HOME"/.ops/images/java*
            done
          fi
      - name: Boot it
        if: matrix.nodes == ''
        run: |
          # the environment of the package wins over -e, so a value that differs between the traced
          # container and the machine is put in the manifest
          if [ -n "$BOOTENV" ]; then
            m="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME/package.manifest"
            jq --arg k "${BOOTENV%%=*}" --arg v "${BOOTENV#*=}" '.Env[$k] = $v' "$m" > "$m.new" && mv "$m.new" "$m"
            jq -c '.Env' "$m"
          fi
          cfg='{}'
          if [ -n "$KLIBS" ]; then cfg=$(echo "$cfg" | jq -c --arg k "$KLIBS" '.Klibs = ($k | split(" "))'); fi
          if [ -d kdist ]; then
            cfg=$(echo "$cfg" | jq -c --arg d "$PWD/kdist" '.Kernel = ($d + "/kernel.img") | .Boot = ($d + "/boot.img") | .KlibDir = ($d + "/klibs")')
            find "$HOME/.ops" -maxdepth 2 -name kernel.img -exec sha256sum {} +; sha256sum kdist/kernel.img
          fi
          echo "$cfg" > klibs.json; cat klibs.json
          if [ "$NAME" = clock ]; then
            python3 - > skew.txt 2> skew.err <<'PY' &
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("0.0.0.0", 47000)); s.settimeout(400)
          t0 = None
          try:
              while True:
                  d, _ = s.recvfrom(100); now = time.time()
                  _, ms, mono = d.decode().split()
                  if t0 is None: t0 = now
                  print("host-minus-guest wallclock ms %d  guest-monotonic-ms %s host-elapsed-ms %d" % (int(now * 1000) - int(ms), mono, int((now - t0) * 1000)), flush=True)
          except Exception:
              pass
          PY
            sleep 2; ss -ulnp | grep 47000 || echo 'nothing listens on 47000'
          fi
          ./ops pkg load -l "t-$NAME" --accel=false -c klibs.json -v ${UDP:+--udp "$UDP"} ${PORT:+-p "$PORT"} > boot.log 2>&1 &
          ok=0
          for i in $(seq 1 "$WAIT"); do
            if [ -n "$PORT" ]; then
              curl -sS --max-time 2 "http://127.0.0.1:$PORT$URL_PATH" 2>/dev/null | grep -q -- "$MATCH" && { ok=1; break; }
              sleep 2
            else
              sleep 2
              grep -q -- "$MATCH" boot.log && { ok=1; break; }
            fi
            if ! pgrep -f qemu-system > /dev/null && [ "$i" -gt 30 ]; then echo "the machine stopped after $i turns"; break; fi
          done
          if [ $ok = 0 ] && [ -n "$PORT" ]; then
            echo "last answer: $(curl -sS --max-time 5 -o /dev/null -w 'http %{http_code}' "http://127.0.0.1:$PORT$URL_PATH" 2>&1 | head -c 300)"
          fi
          if [ $ok = 1 ] && [ -n "$PORT" ]; then
            echo "ANSWER from http://127.0.0.1:$PORT$URL_PATH:"; curl -sS --max-time 5 "http://127.0.0.1:$PORT$URL_PATH" 2>&1 | head -c 300; echo
          fi
          if [ $ok = 1 ] && [ -n "$CLIENT" ]; then
            jar=$(ls sc/test/dockerfile/aeron/admin/build/libs/*-uber.jar | head -1)
            echo "client: $jar, egress address $(ip -4 -o addr show eth0 | awk '{print $4}')"
            if [ "$CLIENT" = admin ]; then
              ( sleep 30; echo "add-participant id=777 name=nanosclient"; sleep 8; echo "list-participants"; sleep 5; \
                echo "add-auction name=vase created-by=500 duration=20"; sleep 8; echo "list-auctions"; sleep 3; \
                echo "add-bid auction-id=1 created-by=501 price=100"; sleep 4; echo "add-bid auction-id=1 created-by=777 price=250"; sleep 4; \
                echo "list-auctions"; sleep 20; echo "list-auctions"; sleep 5; echo "exit" ) \
                | AUTO_CONNECT=true DUMB_TERMINAL=true PARTICIPANT_ID=500 CLUSTER_ADDRESSES=127.0.0.1 timeout 220 java -jar "$jar" > client.log 2>&1 || true
            else
              ( sleep 30; echo "add-participant id=777 name=nanosclient"; sleep 10; echo "list-participants"; sleep 10; echo "exit" ) \
                | AUTO_CONNECT=true DUMB_TERMINAL=true PARTICIPANT_ID=500 CLUSTER_ADDRESSES=127.0.0.1 timeout 150 java -jar "$jar" > client.log 2>&1 || true
            fi
            grep -o "hostfwd[^ ]*" boot.log | sort -u | head -5; tr '\r' '\n' < boot.log | grep -v '^ *[0-9]*% ' | tail -15 | cut -c1-200
            echo "--- client log ---"; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' client.log | tr '\r' '\n' | grep -v '^ *$' | tail -40
            need="Connected to cluster leader|Participant added with id"
            [ "$CLIENT" = admin ] && need="$need|Auction added with id|Bid added to auction|won! Total 2 bids|Auction count"
            miss=0; for pat in ${need//|/ }; do :; done
            IFS='|' read -ra pats <<< "$need"
            for pat in "${pats[@]}"; do grep -q "$pat" client.log || { echo "missing: $pat"; miss=1; }; done
            if [ $miss = 0 ]; then echo "CLIENT PASS"; else echo "CLIENT FAIL"; ok=0; fi
          fi
          [ "$NAME" = clock ] && { echo "--- clock ---"; sed -n '1p;10p;20p;40p;$p' skew.txt; wc -l skew.txt; cat skew.err; }
          pkill -f qemu-system || true
          sleep 2
          clean() { tr '\r' '\n' < boot.log | grep -vE '^ *[0-9]+% \||^ *$|^warning: stat |points at nothing|is left out:' | cut -c1-400; }
          if [ $ok = 1 ]; then
            echo "BOOT PASS $NAME after $i turns"; clean | grep -m3 -- "$MATCH" || true
            exit 0
          fi
          echo "BOOT FAIL $NAME (wanted: $MATCH)"
          echo "--- first ---"; clean | head -40 || true
          echo "--- last ---"; clean | tail -80 || true
          exit 1
      # The same package on a bridge: NODES machines, each its own qemu on a tap of br0, with the
      # address of br0 on the host, where the admin client of the sample runs.
      - name: Boot on a bridge
        if: matrix.nodes != ''
        env:
          NODES: ${{ matrix.nodes }}
          DNS: ${{ matrix.dns }}
        run: |
          set -u
          sudo ip link add br0 type bridge
          sudo ip addr add 192.168.100.1/24 dev br0
          sudo ip link set br0 up
          # the client of the sample advertises the first address of an interface whose name starts
          # with eth0; this one is on the bridge, so that the machines can reach it
          sudo ip link add eth0z type dummy
          sudo ip addr add 192.168.100.100/32 dev eth0z
          sudo ip link set eth0z up
          ip -4 -o addr | awk '{print $2, $4}'
          addrs=""; for i in $(seq 0 $((NODES - 1))); do addrs="$addrs${addrs:+,}192.168.100.$((11 + i))"; done
          echo "cluster addresses: $addrs"
          if [ -n "$DNS" ]; then
            # names for the machines, answered by a small name server on the bridge address, and in
            # the hosts file of the runner for the client
            names=""; hosts=""
            for i in $(seq 0 $((NODES - 1))); do names="${names}${names:+,}node$i.nanos"; hosts="${hosts}192.168.100.$((11 + i)) node$i.nanos\n"; done
            printf "$hosts" | sudo tee -a /etc/hosts > /dev/null
            sudo env NAMES="$names" python3 - > dns.log 2>&1 <<'PY' &
          import os, socket, struct
          names = {("node%d.nanos" % i).encode(): "192.168.100.%d" % (11 + i) for i in range(len(os.environ["NAMES"].split(",")))}
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.bind(("192.168.100.1", 53))
          while True:
              d, a = s.recvfrom(512)
              i = 12; labels = []
              while d[i]:
                  n = d[i]; labels.append(d[i + 1:i + 1 + n]); i += n + 1
              name = b".".join(labels).lower(); qtype = struct.unpack("!H", d[i + 1:i + 3])[0]; q = d[12:i + 5]
              ip = names.get(name)
              print("DNS query", name.decode(), qtype, "->", ip if qtype == 1 else None, flush=True)
              if ip and qtype == 1:
                  r = d[:2] + b"\x81\x80\x00\x01\x00\x01\x00\x00\x00\x00" + q + b"\xc0\x0c\x00\x01\x00\x01\x00\x00\x00\x3c\x00\x04" + socket.inet_aton(ip)
              else:
                  r = d[:2] + b"\x81\x80\x00\x01\x00\x00\x00\x00\x00\x00" + q
              s.sendto(r, a)
          PY
            sleep 2
            addrs="$names"
            echo "cluster names: $addrs"
          fi
          p="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME"
          for i in $(seq 0 $((NODES - 1))); do
            sudo ip tuntap add dev tap$i mode tap
            sudo ip link set tap$i master br0
            sudo ip link set tap$i up
            cp -al "$p" "$p-$i"
            m="$p-$i/package.manifest"
            jq --arg a "$addrs" --arg n "$i" '.Env.CLUSTER_ADDRESSES = $a | .Env.CLUSTER_NODE = $n' "$m" > "$m.new" && mv "$m.new" "$m"
            jq -c '.Env' "$m"
          done
          cfg='{}'
          if [ -n "$KLIBS" ]; then cfg=$(echo "$cfg" | jq -c --arg k "$KLIBS" '.Klibs = ($k | split(" "))'); fi
          if [ -d kdist ]; then
            cfg=$(echo "$cfg" | jq -c --arg d "$PWD/kdist" '.Kernel = ($d + "/kernel.img") | .Boot = ($d + "/boot.img") | .KlibDir = ($d + "/klibs")')
          fi
          if [ -n "$DNS" ]; then cfg=$(echo "$cfg" | jq -c '.NameServers = ["192.168.100.1"]'); fi
          echo "$cfg" > klibs.json
          for i in $(seq 0 $((NODES - 1))); do
            sudo -E env "HOME=$HOME" ./ops pkg load -l "t-$NAME-$i" --accel=false -c klibs.json -m 2g -i "img$i" \
              -b -t tap$i --bridgename br0 --bridgeipaddress 192.168.100.1 --ip-address 192.168.100.$((11 + i)) \
              --netmask 255.255.255.0 --gateway 192.168.100.1 > boot$i.log 2>&1 &
          done
          leaders=0
          for t in $(seq 1 300); do
            sleep 2
            leaders=$(cat boot*.log | grep -c "Role change: LEADER" || true)
            [ "$leaders" -ge 1 ] && break
          done
          echo "leaders after $t turns: $leaders"
          for i in $(seq 0 $((NODES - 1))); do echo "== node $i"; tr '\r' '\n' < boot$i.log | grep -E "assigned|Started|Role change|Client session|Exception|ERROR" | head -12 | cut -c1-200; done
          if [ -n "$CLIENT" ]; then
            sleep 60
            jar=$(ls sc/test/dockerfile/aeron/admin/build/libs/*-uber.jar | head -1)
            echo "client: egress address $(ip -4 -o addr show eth0 | awk '{print $4}'), ingress hosts $addrs"
            ip -4 -o addr | awk '{print $2, $4}'
            ( sleep 20; echo "add-participant id=777 name=bridgeclient"; sleep 10; echo "list-participants"; sleep 10; echo "exit" ) \
              | AUTO_CONNECT=true DUMB_TERMINAL=true PARTICIPANT_ID=500 CLUSTER_ADDRESSES="$addrs" timeout 200 java -jar "$jar" > client.log 2>&1 || true
            echo "--- client log ---"; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' client.log | tr '\r' '\n' | grep -v '^ *$' | tail -40
          fi
          [ -n "$DNS" ] && { echo "--- name server log ---"; sort dns.log | uniq -c | head -20; }
          echo "--- roles ---"; for i in $(seq 0 $((NODES - 1))); do echo "node $i: $(tr '\r' '\n' < boot$i.log | grep 'Role change' | tr '\n' ' ')"; done
          nl=0; nf=0
          for i in $(seq 0 $((NODES - 1))); do
            last=$(tr '\r' '\n' < boot$i.log | grep 'Role change' | tail -1)
            case "$last" in *LEADER*) nl=$((nl + 1));; *) nf=$((nf + 1));; esac
          done
          echo "nodes whose last role is LEADER: $nl, others: $nf"
          ok=1
          [ "$nl" = 1 ] || ok=0
          started=$(cat boot*.log | grep -c "Started Cluster Node" || true); echo "nodes started: $started"
          [ "$started" = "$NODES" ] || ok=0
          for i in $(seq 0 $((NODES - 1))); do echo "node $i saw: $(tr '\r' '\n' < boot$i.log | grep -E 'Client session|Adding participant' | tr '\n' ' ')"; done
          if [ -n "$CLIENT" ]; then grep -q "Connected to cluster leader" client.log && grep -q "Participant added with id" client.log || ok=0; fi
          sudo pkill -f "ops pkg load" || true
          for i in $(seq 0 $((NODES - 1))); do sudo pkill -f "img$i" || true; done
          if [ $ok = 1 ]; then echo "BRIDGE PASS $NAME"; exit 0; fi
          echo "BRIDGE FAIL $NAME"; exit 1
      # Diagnosis only: the same package made while the traced container is asked over its port,
      # to tell a file reached only when a request is served from anything else.
      - name: Diagnose with a request during the trace
        if: failure() && env.DIAG == 'true'
        run: |
          (
            for i in $(seq 1 40); do
              c=$(docker ps -q --filter "ancestor=jc-$NAME:latest" | head -1)
              if [ -n "$c" ]; then
                ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$c")
                curl -s --max-time 2 -o /dev/null "http://$ip:$PORT$URL_PATH" && echo "asked the traced container at $ip"
              fi
              sleep 3
            done
          ) > ask.log 2>&1 &
          mapfile -d '' flags < flags.bin
          ./ops pkg from-docker "jc-$NAME:latest" --observe --observe-timeout "$TRACE" --name "t-$NAME-x" --verbose "${flags[@]}" > pkg2.log 2>&1
          wait
          sort -u ask.log | head -3
          grep -E '^the program opened' pkg2.log || true
          a="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME/sysroot"; b="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME-x/sysroot"
          echo "carried only when a request was served:"
          comm -13 <(cd "$a" && find . | sort) <(cd "$b" && find . | sort) | head -30
          ./ops pkg load -l "t-$NAME-x" --accel=false -p "$PORT" > boot2.log 2>&1 &
          ok=0
          for i in $(seq 1 "$WAIT"); do
            curl -sS --max-time 2 "http://127.0.0.1:$PORT$URL_PATH" 2>/dev/null | grep -q -- "$MATCH" && { ok=1; break; }
            sleep 2
          done
          pkill -f qemu-system || true
          if [ $ok = 1 ]; then echo "DIAG BOOT PASS $NAME with a request during the trace"; else echo "DIAG BOOT FAIL $NAME"; tail -20 boot2.log; fi
      # Diagnosis only: the package booted again with what the manifest lacks - the working directory
      # and the other passthrough keys pkg load drops, a disk with room, uname Linux, the program
      # under its real name, a host name the machine can resolve - to tell which of these the
      # failure needs.
      - name: Boot with the manifest completed
        if: failure()
        run: |
          p="$HOME/.ops/local_packages/$(dpkg --print-architecture)/t-$NAME"; m="$p/package.manifest"; s="$p/sysroot"
          [ -f "$m" ] || { echo "no package"; exit 0; }
          mb=$(du -sm "$s" | cut -f1)
          prog=$(jq -r .Program "$m")
          real=$(docker run --rm --entrypoint readlink "jc-$NAME:latest" -f "$prog" 2>/dev/null || true)
          if [ -n "$real" ] && [ "$real" != "$prog" ] && [ -f "$s$real" ]; then
            cp "$m" "$m.orig"; jq --arg r "$real" '.Program = $r' "$m.orig" > "$m"
          fi
          jq -c --arg sz "$((mb * 2 + 256))m" '{BaseVolumeSz: $sz, ManifestPassthrough: ((.ManifestPassthrough // {}) + {uname: {sysname: "Linux"}})}' "$m" > cfg.json
          cat cfg.json; echo
          boot() {
            ./ops pkg load -l "t-$NAME" --accel=false -c cfg.json ${PORT:+-p "$PORT"} > "$1" 2>&1 &
            ok=0
            for i in $(seq 1 "$WAIT"); do
              if [ -n "$PORT" ]; then
                curl -sS --max-time 2 "http://127.0.0.1:$PORT$URL_PATH" 2>/dev/null | grep -q -- "$MATCH" && { ok=1; break; }
                sleep 2
              else
                sleep 2
                grep -q -- "$MATCH" "$1" && { ok=1; break; }
              fi
              if ! pgrep -f qemu-system > /dev/null && [ "$i" -gt 30 ]; then echo "the machine stopped after $i turns"; break; fi
            done
            pkill -f qemu-system || true
            sleep 3
            if [ $ok = 1 ]; then echo "COMPLETED BOOT PASS $NAME ($1) after $i turns"; return 0; fi
            echo "COMPLETED BOOT FAIL $NAME ($1)"
            tr '\r' '\n' < "$1" | grep -vE '^ *[0-9]+% \||^ *$|^warning: |points at nothing|is left out:|^\s+at |^ +[0-9a-f]{16}:|^ +r[0-9a-z]+: ' | cut -c1-300 | awk '!s[$0]++' | grep -E -m 25 -i 'error|exception|fatal|SIG|problematic|# [JVC] |caused|unknown|fail' || true
            return 1
          }
          # which of the additions each failure needs: first without a host name it can resolve,
          # twice, then with one and without uname Linux
          boot boot3.log; a=$?
          boot boot4.log; b=$?
          echo "t-$NAME" > "$s/etc/hostname"
          printf '127.0.0.1\tlocalhost t-%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' "$NAME" > "$s/etc/hosts"
          jq -c 'del(.ManifestPassthrough.uname)' cfg.json > cfg2.json && mv cfg2.json cfg.json
          echo "with a host name, without uname: $(cat cfg.json)"
          boot boot5.log
          exit 1
