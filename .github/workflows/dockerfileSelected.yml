name: Dockerfile support (chosen scenarios)

# The scenarios of dockerfileMatrix.yml that are being worked on, rather than all of them.

on:
  push:
    branches: [feat/from-dockerfile]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o ops -v
      - uses: actions/upload-artifact@v4
        with:
          name: ops
          path: ops

  scenario:
    name: ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [exercise, exercise-without, temurin-jre-resolved, mysql-resolved]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ops
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      - name: Run the scenario
        run: |
          chmod +x ops test/dockerfile/run.sh
          export OPS="$PWD/ops"
          ./test/dockerfile/run.sh ${{ matrix.scenario }}

      - name: What the package looks like
        if: always()
        run: |
          for p in "$HOME"/.ops/local_packages/*/dockerfile-test-*; do
            [ -d "$p/sysroot" ] || continue
            echo "--- $p/package.manifest"; cat "$p/package.manifest"
            echo "--- $p/sysroot"
            (cd "$p/sysroot" && find . -maxdepth 2 -not -path . | sort && du -sh ./* | sort -h | tail -8)
            echo "--- etc/systemd"
            (cd "$p/sysroot" && find etc/systemd -ls 2>/dev/null | head -30)
            echo "--- usr"
            (cd "$p/sysroot" && du -sh usr/* usr/lib/* usr/share/* 2>/dev/null | sort -h | tail -15)
            echo "--- what weighs, five levels down"
            (cd "$p/sysroot" && du -x --max-depth=5 -m . 2>/dev/null | sort -n | tail -40)
            echo "--- the biggest files"
            (cd "$p/sysroot" && find . -type f -size +5M -printf '%s\t%p\n' | sort -n | tail -25)
            echo "--- libraries"
            (cd "$p/sysroot" && find lib lib64 usr/lib -maxdepth 3 \( -type f -o -type l \) 2>/dev/null | sort)
          done
