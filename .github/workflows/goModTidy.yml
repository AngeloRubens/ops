name: go mod tidy

# Brings go.mod and go.sum up to date with the imports of the branch, for a checkout that has no go
# to run it with, and hands them back.

on:
  push:
    branches: [ci/go-mod-tidy]

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: tidy
        run: |
          go get github.com/knqyf263/go-rpmdb/pkg@v0.1.1
          go get modernc.org/sqlite@latest
          git diff --stat

      - uses: actions/upload-artifact@v4
        with:
          name: gomod
          path: |
            go.mod
            go.sum

      - name: build
        run: go build -o /tmp/ops . && go vet ./cmd/...
