name: Checks dns_search

on:
  push:
    branches: ['check/**']
  workflow_dispatch:

jobs:
  checks:
    name: gofmt, vet, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd/ lepton/ types/)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            gofmt -d cmd/ lepton/ types/
            exit 1
          fi

      - name: vet
        run: go vet ./cmd/... ./lepton/... ./types/...

      - name: build
        run: go build -o ops -v

      - name: new tests by name
        run: go test ./cmd/... ./lepton/... -count 1 -v -run 'DNSSearch|ResolvConf'

      - name: full suite of the changed packages
        continue-on-error: true
        run: go test ./cmd/... ./lepton/... ./types/... -count 1 2>&1 | tee full.log
